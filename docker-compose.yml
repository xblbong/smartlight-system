version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: smartlight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - smartlight-network

  app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: smartlight-app
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      - mysql
    networks:
      - smartlight-network

  mysql:
    image: mysql:5.7
    container_name: smartlight-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartlight_db
      MYSQL_ROOT_PASSWORD: smartlight_root_password
      MYSQL_USER: smartlight_user
      MYSQL_PASSWORD: smartlight_password
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartlight-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smartlight-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - smartlight-network

networks:
  smartlight-network:

volumes:
  mysql_data:
