version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: smartlight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./smart-light-backend:/var/www/html
    depends_on:
      - app
    networks:
      - smartlight-network

  app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: smartlight-app
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      - mysql
    networks:
      - smartlight-network

  mysql:
    image: mysql:5.7
    container_name: smartlight-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartlight-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: smartlight-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=smartlight-mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
      - PMA_ABSOLUTE_URI=https://phpmyadmin.munndev.my.id/
      - UPLOAD_LIMIT=100M
      - MEMORY_LIMIT=256M
      - PMA_QUERY_HISTORYDB=false
      - PMA_USER_CONFIG=/etc/phpmyadmin/config.user.php
#    volumes:
#      - ./phpmyadmin-config:/etc/phpmyadmin  
    depends_on:
      - mysql
    networks:
      - smartlight-network
networks:
  smartlight-network:

volumes:
  mysql_data:
