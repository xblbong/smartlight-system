services:

  # ── Nginx (Backend reverse proxy, internal only) ──
  nginx:
    image: nginx:alpine
    container_name: smartlight-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public:/var/www/html/public
    depends_on:
      app:
        condition: service_started
    networks:
      - smartlight-network

  # ── Laravel Backend (PHP-FPM) ──
  app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: smartlight-backend
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartlight-network

  # ── Frontend (React SPA + Nginx, expose port 80 & 443) ──
  frontend:
    build:
      context: .
      dockerfile: smart-light-frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: smartlight-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      nginx:
        condition: service_started
    networks:
      - smartlight-network

  # ── MySQL 8.0 ──
  mysql:
    image: mysql:8.0
    container_name: smartlight-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-smartlight}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER:-smartlight}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smartlight-network

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: smartlight-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartlight-network

  # ── phpMyAdmin (opsional, akses via SSH tunnel: localhost:8081) ──
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: smartlight-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
      MEMORY_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartlight-network

  # ── Queue Worker ──
  queue:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: smartlight-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - smartlight-network

networks:
  smartlight-network:

volumes:
  mysql_data:
  redis_data:
  backend_storage:
  backend_public:
