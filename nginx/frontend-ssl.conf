# frontend-ssl.conf — HTTPS config untuk smartlight.munndev.my.id
# Setelah certbot generate SSL, rename file ini ke frontend.conf

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name smartlight.munndev.my.id;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name smartlight.munndev.my.id;

    # SSL certificates (generated by certbot)
    ssl_certificate /etc/letsencrypt/live/smartlight.munndev.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartlight.munndev.my.id/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — semua client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests ke backend container
    location /api {
        proxy_pass http://smartlight-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_connect_timeout 10;
        proxy_send_timeout 10;
    }

    # Cache static assets (Vite hashed filenames are immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
